name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      openapi: ${{ steps.filter.outputs.openapi }}
      relay: ${{ steps.filter.outputs.relay }}
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'lecturo-web/web/**'
              - 'lecturo-web/Dockerfile'
              - '.github/workflows/ci.yml'
            server:
              - 'lecturo-web/server/**'
              - 'lecturo-web/Dockerfile'
              - '.github/workflows/ci.yml'
            openapi:
              - 'lecturo-web/api/**'
              - 'lecturo-web/redocly.yaml'
              - '.github/workflows/ci.yml'
            relay:
              - 'lecturo-relay/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci.yml'
            android:
              - 'lecturo-android/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'lecturo-desktop/**'
              - '.github/workflows/ci.yml'

  web:
    name: web (format, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecturo-web/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lecturo-web/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "src/**/*.{ts,html,scss}"
      - run: pnpm test
      - run: pnpm build

  server:
    name: server (fmt, vet, test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecturo-web/server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lecturo?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: lecturo-web/server/go.sum

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  openapi:
    name: openapi (lint)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npx -y @redocly/cli@latest lint lecturo-web/api/openapi.yaml

  relay:
    name: relay (test)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew -p lecturo-relay test

  android:
    name: android (domain + app unit tests)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecturo-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      # compileSdk is 36.1 (an unusual platform); install it explicitly rather
      # than relying on AGP's auto-download. Build-tools are fetched by AGP.
      - run: sdkmanager --install "platforms;android-36.1"

      # JVM unit tests only; no emulator is needed.
      - run: ./gradlew :domain:test :app:testDebugUnitTest --no-daemon

  desktop:
    name: desktop (build + test)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test lecturo-desktop/Tests/Lecturo.Tests.csproj
