apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lecturo

resources:
  - ../../base

# The deploy workflow overrides newName/newTag with the freshly built images.
images:
  - name: lecturo-web
    newName: adipginting/lecturo-web
    newTag: latest
  - name: lecturo-relay
    newName: adipginting/lecturo-relay
    newTag: latest

patches:
  - path: patch-ingress.yaml
