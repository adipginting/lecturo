# The Go API with the Angular SPA embedded (single binary). State lives in
# Postgres and the S3-compatible blob store, so the pod itself is stateless.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U lecturo -d lecturo; do sleep 2; done
        - name: wait-for-blob
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z seaweedfs 8333; do sleep 2; done
      containers:
        - name: web
          image: lecturo-web
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: LECTURO_ADDR
              value: ":8787"
            - name: LECTURO_COOKIE_SECURE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lecturo-postgres
                  key: DATABASE_URL
            - name: LECTURO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lecturo-web-secrets
                  key: LECTURO_ENCRYPTION_KEY
            - name: BLOB_ENDPOINT
              value: seaweedfs:8333
            - name: BLOB_BUCKET
              value: lecturo
            - name: BLOB_REGION
              value: us-east-1
            - name: BLOB_USE_SSL
              value: "false"
            - name: BLOB_VIRTUAL_HOST
              value: "false"
            - name: BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lecturo-web-secrets
                  key: BLOB_ACCESS_KEY
            - name: BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lecturo-web-secrets
                  key: BLOB_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
