# Postgres for relational data (users, sessions, documents, conversations).
# The web app applies its embedded migrations on start, so no migration Job is
# needed. The password arrives in the `lecturo-postgres` Secret, created by the
# deploy workflow and never committed.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lecturo
            - name: POSTGRES_USER
              value: lecturo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lecturo-postgres
                  key: POSTGRES_PASSWORD
            # Keep the cluster in a subdirectory so it can live on a mounted
            # volume root (local-path) without the lost+found problem.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lecturo", "-d", "lecturo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lecturo", "-d", "lecturo"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
