# Lecturo Cloud: one upstream key, a per-device daily quota counter. The only
# state is the quota file, kept on a small volume so counters survive restarts.
apiVersion: v1
kind: Service
metadata:
  name: relay
  labels:
    app: relay
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relay-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: 1
  strategy:
    # The quota volume is ReadWriteOnce; never run two pods at once.
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: lecturo-relay
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: RELAY_PORT
              value: "8787"
            - name: QUOTA_FILE
              value: /data/relay-quota.json
            - name: UPSTREAM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: lecturo-relay-secrets
                  key: UPSTREAM_BASE_URL
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lecturo-relay-secrets
                  key: UPSTREAM_API_KEY
            - name: UPSTREAM_MODEL
              valueFrom:
                secretKeyRef:
                  name: lecturo-relay-secrets
                  key: UPSTREAM_MODEL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relay-data
