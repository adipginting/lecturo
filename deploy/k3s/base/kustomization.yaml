apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lecturo

resources:
  - namespace.yaml
  - postgres.yaml
  - seaweedfs.yaml
  - web.yaml
  - relay.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lecturo

images:
  - name: lecturo-web
    newTag: latest
  - name: lecturo-relay
    newTag: latest
